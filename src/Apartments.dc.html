<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apartments</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Jost:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C1B19}a:hover{color:#5E4C3C}
</style>
</helmet>
<div style="width: 390px; height: 1180px; position: relative; overflow: hidden; background: #F3EFE8; font-family: 'Jost', system-ui, sans-serif; color: #1C1B19">
<div style="padding: 58px 20px 0; display: flex; flex-direction: column; gap: 14px">
<h1 style="margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: 40px; line-height: 1">Apartments</h1>
<a href="Dates.dc.html" style="display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 16px; border-radius: 26px; background: #FFFFFF; border: 1px solid #E6E0D6; text-decoration: none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1C1B19" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>
<span style="flex: 1; font-size: 15px; font-weight: 500">24 – 27 Oct · 3 nights · 2 guests</span>
<span style="font-size: 14px; text-decoration: underline; text-underline-offset: 3px">Change</span>
</a>
<div style="display: flex; gap: 8px">
<sc-for list="{{chips}}" as="chip" hint-placeholder-count="4">
<sc-if value="{{chip.on}}" hint-placeholder-val="{{false}}">
<button onClick="{{chip.pick}}" aria-pressed="true" style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid #1C1B19; background: #1C1B19; color: #F3EFE8; font-family: inherit; font-size: 14px; font-weight: 500">{{chip.label}}</button>
</sc-if>
<sc-if value="{{chip.off}}" hint-placeholder-val="{{true}}">
<button onClick="{{chip.pick}}" aria-pressed="false" style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid #DDD6CB; background: #FBF9F5; color: #1C1B19; font-family: inherit; font-size: 14px">{{chip.label}}</button>
</sc-if>
</sc-for>
</div>
<div style="font-size: 14px; color: #625B52">{{summary}}</div>
</div>
<div style="padding: 12px 20px 120px; display: flex; flex-direction: column; gap: 22px">
<sc-for list="{{units}}" as="u" hint-placeholder-count="3">
<a href="Apartment.dc.html" style="display: block; text-decoration: none; color: #1C1B19">
<div style="position: relative">
<img src="{{u.img}}" alt="{{u.alt}}" style="width: 100%; height: 200px; border-radius: 20px; object-fit: cover; display: block">
<sc-if value="{{u.free}}" hint-placeholder-val="{{true}}">
<span style="position: absolute; left: 12px; top: 12px; padding: 7px 12px; border-radius: 16px; background: #FBF9F5; font-size: 13px; font-weight: 500; color: #1C1B19">{{u.badge}}</span>
</sc-if>
<sc-if value="{{u.full}}" hint-placeholder-val="{{false}}">
<span style="position: absolute; left: 12px; top: 12px; padding: 7px 12px; border-radius: 16px; background: #1C1B19; font-size: 13px; font-weight: 500; color: #F3EFE8">{{u.badge}}</span>
</sc-if>
<span aria-hidden="true" style="position: absolute; right: 12px; top: 12px; width: 36px; height: 36px; border-radius: 18px; background: rgba(251,249,245,0.92); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1C1B19" stroke-width="1.6" stroke-linejoin="round"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"></path></svg></span>
</div>
<div style="margin-top: 12px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
<div style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 25px; font-weight: 600; line-height: 1.1">{{u.name}}</div>
<div style="font-size: 15px; white-space: nowrap"><span style="font-weight: 600">{{u.price}}</span><span style="color: #625B52"> /night</span></div>
</div>
<div style="margin-top: 4px; display: flex; justify-content: space-between; font-size: 14px; color: #625B52">
<span>{{u.specs}}</span><span>{{u.total}}</span>
</div>
</a>
</sc-for>
</div>
<nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 86px; box-sizing: border-box; padding: 10px 18px 22px; background: #FBF9F5; border-top: 1px solid #E6E0D6; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
<a href="Home.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; text-decoration: none; color: #625B52"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#625B52" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7V20.5h-5.5v-6h-6v6H3.5z"></path></svg>Home</a>
<a href="Apartments.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; text-decoration: none; color: #1C1B19"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1C1B19" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 20.5V5l7.5-2 7.5 2v15.5M9.5 20.5v-4h5v4M8.5 8.5h2M13.5 8.5h2M8.5 12.5h2M13.5 12.5h2"></path></svg>Apartments</a>
<a href="Trips.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; text-decoration: none; color: #625B52"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#625B52" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>My stays</a>
<a href="Me.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; text-decoration: none; color: #625B52"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#625B52" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 20.5c.9-4 4-6 8-6s7.1 2 8 6"></path></svg>Me</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1180}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { beds: 'all' };
}
renderVals() {
const beds = this.state.beds;
const all = [
{ beds: '1', name: 'One-Bedroom Suite', img: '/_blob/3574bd388b856f88fa1c81fbb382af52', alt: 'One-bedroom suite bedroom', price: '₦120,000', specs: '2 guests · 1 bedroom · 1 bath', total: '₦360,000 total', free: true, badge: '4 free for your dates' },
{ beds: '2', name: 'Two-Bedroom Apartment', img: '/_blob/f10ae0e582d91e9ea3dd83c68fd03161', alt: 'Two-bedroom apartment living room', price: '₦200,000', specs: '4 guests · 2 bedrooms · 2 baths', total: '₦600,000 total', free: true, badge: 'Only 1 left' },
{ beds: '3', name: 'Three-Bedroom Apartment', img: '/_blob/0029a94c120ad28600ebfb2d7674ee73', alt: 'Three-bedroom apartment living room', price: '₦300,000', specs: '6 guests · 3 bedrooms · 3 baths', total: 'Next free 2 Nov', free: false, badge: 'Booked for these dates' }
];
const units = all.filter((u) => beds === 'all' || u.beds === beds).map((u) => ({ ...u, full: !u.free }));
const chips = [['all', 'All'], ['1', '1 bed'], ['2', '2 beds'], ['3', '3 beds']].map(([id, label]) => ({
label, on: beds === id, off: beds !== id, pick: () => this.setState({ beds: id })
}));
const free = units.filter((u) => u.free).length;
return { chips, units, summary: free + ' of ' + units.length + ' apartment types free for 24 – 27 Oct' };
}
}
</script>
</body>
</html>
