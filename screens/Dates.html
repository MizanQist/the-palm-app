<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Choose your dates · The Palm</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Jost:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C1B19}a:hover{color:#5E4C3C}
</style>
</head>
<body>
<div id="dc"></div>
<template id="tpl">

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #1C1B19; font-family: 'Jost', system-ui, sans-serif; color: #1C1B19">
<img src="../assets/living.webp" alt="" style="position: absolute; top: 0; left: 0; width: 100%; height: 200px; object-fit: cover; opacity: 0.45">
<div style="position: absolute; left: 0; right: 0; top: 96px; bottom: 0; border-radius: 28px 28px 0 0; background: #F3EFE8; padding: 10px 20px 0; display: flex; flex-direction: column">
<div style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #CFC7BA"></div>
<div style="margin-top: 14px; display: flex; justify-content: space-between; align-items: center">
<h1 style="margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: 32px">Choose your dates</h1>
<a href="Apartment.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #DDD6CB; background: #FBF9F5; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1C1B19" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
</div>
<div style="font-size: 14px; color: #625B52">Two-Bedroom Apartment · ₦200,000 a night</div>
<div style="margin-top: 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="padding: 10px 14px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E6E0D6"><div style="font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #625B52">Check-in</div><div style="font-size: 16px; font-weight: 500">{{inLabel}}</div></div>
<div style="padding: 10px 14px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E6E0D6"><div style="font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #625B52">Check-out</div><div style="font-size: 16px; font-weight: 500">{{outLabel}}</div></div>
</div>
<div style="margin-top: 18px; display: flex; justify-content: space-between; align-items: center">
<button aria-label="Previous month" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #DDD6CB; background: #FBF9F5; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1C1B19" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
<div style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 24px; font-weight: 600">October 2026</div>
<button aria-label="Next month" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #DDD6CB; background: #FBF9F5; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1C1B19" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
</div>
<div style="margin-top: 12px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; font-size: 12px; letter-spacing: 0.08em; color: #625B52">
<span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span>SAT</span><span>SUN</span>
</div>
<div style="margin-top: 6px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 4px">
<sc-for list="{{days}}" as="d" hint-placeholder-count="35">
<sc-if value="{{d.blank}}" hint-placeholder-val="{{false}}"><span style="height: 46px"></span></sc-if>
<sc-if value="{{d.past}}" hint-placeholder-val="{{false}}"><span style="height: 46px; display: flex; align-items: center; justify-content: center; font-size: 15px; color: #B3AA9D">{{d.n}}</span></sc-if>
<sc-if value="{{d.booked}}" hint-placeholder-val="{{false}}"><span aria-label="{{d.aria}}" style="height: 46px; display: flex; align-items: center; justify-content: center; font-size: 15px; color: #9A9184; text-decoration: line-through">{{d.n}}</span></sc-if>
<sc-if value="{{d.edge}}" hint-placeholder-val="{{false}}"><button onClick="{{d.pick}}" aria-pressed="true" style="height: 46px; border: 0; padding: 0; background: {{d.band}}; font-family: inherit"><span style="width: 44px; height: 44px; margin: 0 auto; border-radius: 22px; background: #1C1B19; color: #F3EFE8; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600">{{d.n}}</span></button></sc-if>
<sc-if value="{{d.mid}}" hint-placeholder-val="{{false}}"><button onClick="{{d.pick}}" style="height: 46px; border: 0; padding: 0; background: #E2D9CB; color: #1C1B19; font-family: inherit; font-size: 15px; font-weight: 500">{{d.n}}</button></sc-if>
<sc-if value="{{d.open}}" hint-placeholder-val="{{true}}"><button onClick="{{d.pick}}" style="height: 46px; border: 0; padding: 0; background: transparent; color: #1C1B19; font-family: inherit; font-size: 15px">{{d.n}}</button></sc-if>
</sc-for>
</div>
<div style="margin-top: 12px; display: flex; gap: 18px; font-size: 13px; color: #625B52">
<span style="display: flex; align-items: center; gap: 6px"><span style="text-decoration: line-through; color: #9A9184">18</span> Already booked</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 7px; background: #1C1B19"></span> Your stay</span>
</div>
<div style="flex: 1"></div>
<div style="margin: 0 -20px; padding: 14px 20px 30px; background: #FBF9F5; border-top: 1px solid #E6E0D6; display: flex; align-items: center; gap: 14px">
<div style="flex: 1"><div style="font-size: 17px; font-weight: 600">{{total}}</div><div style="font-size: 13px; color: #625B52">{{nightsLabel}}</div></div>
<a href="Review.html" style="display: flex; align-items: center; justify-content: center; height: 54px; padding: 0 30px; border-radius: 27px; background: #1C1B19; color: #F3EFE8; font-size: 16px; font-weight: 500; text-decoration: none">Continue</a>
</div>
</div>
</div>
</template>
<script src="runtime.js"></script>
<script>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { start: 24, end: 27 };
}
renderVals() {
const { start, end } = this.state;
const today = 17;
const booked = [9, 10, 11, 18, 19, 30, 31];
const rate = 200000;
const isBooked = (n) => booked.indexOf(n) !== -1;
const clear = (a, b) => booked.every((x) => x < a || x >= b);
const pick = (n) => () => {
if (!start || end || n <= start || !clear(start, n)) this.setState({ start: n, end: null });
else this.setState({ end: n });
};
const days = [];
for (let i = 0; i < 3; i++) days.push({ blank: true });
for (let n = 1; n <= 31; n++) {
const past = n < today;
const bk = !past && isBooked(n);
const isEdge = !past && !bk && (n === start || n === end);
const inMid = !past && !bk && start && end && n > start && n < end;
let band = 'transparent';
if (isEdge && end && n === start) band = 'linear-gradient(90deg, transparent 50%, #E2D9CB 50%)';
if (isEdge && end && n === end) band = 'linear-gradient(90deg, #E2D9CB 50%, transparent 50%)';
days.push({ n, past, booked: bk, aria: n + ' October, booked', edge: isEdge, mid: !!inMid, open: !past && !bk && !isEdge && !inMid, band, pick: pick(n) });
}
const nights = start && end ? end - start : 0;
const fmt = (n) => { const d = new Date(2026, 9, n); return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }); };
return {
days,
inLabel: start ? fmt(start) : 'Add date',
outLabel: end ? fmt(end) : 'Add date',
total: nights ? '₦' + (nights * rate).toLocaleString('en-NG') : 'Pick a check-out day',
nightsLabel: nights ? nights + (nights === 1 ? ' night' : ' nights') + ' · before the caution deposit' : 'Booked days are crossed out'
};
}
}

mount(Component);
</script>
</body>
</html>
