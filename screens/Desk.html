<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Front desk dashboard · The Palm</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Jost:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C1B19}a:hover{color:#5E4C3C}
</style>
</head>
<body>
<div id="dc"></div>
<template id="tpl">

<div style="min-height: 100vh; box-sizing: border-box; display: flex; flex-wrap: wrap; background: #F3EFE8; font-family: 'Jost', system-ui, sans-serif; color: #1C1B19">
<aside style="flex: 1 1 220px; max-width: 100%; box-sizing: border-box; padding: 28px 18px; background: #1C1B19; color: #F3EFE8; display: flex; flex-direction: column; gap: 26px">
<div style="display: flex; align-items: center; gap: 12px">
<img src="../assets/logo.webp" alt="" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover">
<div><div style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 22px; font-weight: 600; line-height: 1">The Palm</div><div style="font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #CFC7BA">Front desk</div></div>
</div>
<nav aria-label="Front desk" style="display: flex; flex-direction: column; gap: 2px; font-size: 15px">
<a href="#today" aria-current="page" style="padding: 11px 12px; border-radius: 10px; background: rgba(243,239,232,0.12); color: #F3EFE8; text-decoration: none; font-weight: 500">Today</a>
<a href="#calendar" style="padding: 11px 12px; border-radius: 10px; color: #CFC7BA; text-decoration: none">Calendar</a>
<a href="#bookings" style="padding: 11px 12px; border-radius: 10px; color: #CFC7BA; text-decoration: none">Bookings</a>
<a href="#apartments" style="padding: 11px 12px; border-radius: 10px; color: #CFC7BA; text-decoration: none">Apartments and prices</a>
<a href="#guests" style="padding: 11px 12px; border-radius: 10px; color: #CFC7BA; text-decoration: none">Guests and IDs</a>
<a href="#payments" style="padding: 11px 12px; border-radius: 10px; color: #CFC7BA; text-decoration: none; display: flex; justify-content: space-between">Payments<span style="min-width: 22px; height: 22px; border-radius: 11px; background: #F3EFE8; color: #1C1B19; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center">2</span></a>
<a href="#requests" style="padding: 11px 12px; border-radius: 10px; color: #CFC7BA; text-decoration: none; display: flex; justify-content: space-between">Guest requests<span style="min-width: 22px; height: 22px; border-radius: 11px; background: #F3EFE8; color: #1C1B19; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center">2</span></a>
<a href="#reports" style="padding: 11px 12px; border-radius: 10px; color: #CFC7BA; text-decoration: none">Reports</a>
</nav>
<div style="margin-top: auto; padding-top: 16px; border-top: 1px solid rgba(243,239,232,0.16); font-size: 14px"><div style="font-weight: 500">Halima Yusuf</div><div style="color: #CFC7BA">Front desk · day shift</div></div>
</aside>
<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px clamp(16px, 3vw, 36px) 40px; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; justify-content: space-between">
<div>
<div style="font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #625B52">Saturday 24 October</div>
<h1 style="margin: 4px 0 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: 42px; line-height: 1">Good afternoon, Sadiq</h1>
</div>
<div style="display: flex; gap: 10px; flex-wrap: wrap">
<button style="height: 46px; padding: 0 18px; border-radius: 23px; border: 1px solid #CFC7BA; background: #FBF9F5; font-family: inherit; font-size: 15px; color: #1C1B19">Block dates</button>
<button style="height: 46px; padding: 0 20px; border-radius: 23px; border: 0; background: #1C1B19; font-family: inherit; font-size: 15px; font-weight: 500; color: #F3EFE8">Add a booking</button>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px">
<div style="padding: 16px 18px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E6E0D6"><div style="font-size: 13px; color: #625B52">Occupied tonight</div><div style="margin-top: 4px; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 40px; font-weight: 600; line-height: 1">9 <span style="font-size: 22px; color: #625B52">of 12</span></div></div>
<div style="padding: 16px 18px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E6E0D6"><div style="font-size: 13px; color: #625B52">Arriving today</div><div style="margin-top: 4px; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 40px; font-weight: 600; line-height: 1">3</div></div>
<div style="padding: 16px 18px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E6E0D6"><div style="font-size: 13px; color: #625B52">Leaving today</div><div style="margin-top: 4px; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 40px; font-weight: 600; line-height: 1">2</div></div>
<div style="padding: 16px 18px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E6E0D6"><div style="font-size: 13px; color: #625B52">Paid this month</div><div style="margin-top: 4px; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 40px; font-weight: 600; line-height: 1">₦18.4m</div></div>
</div>
<section aria-label="Calendar" style="border-radius: 20px; background: #FFFFFF; border: 1px solid #E6E0D6; padding: 18px">
<div style="display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center">
<h2 style="margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: 28px">Next 10 nights</h2>
<div style="display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px; color: #3D3832">
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 4px; background: #1C1B19"></span>Booked in the app</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 4px; background: #6E5843"></span>Added by staff (Instagram, phone, walk-in)</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 4px; border: 1.5px dashed #1C1B19"></span>Waiting for payment</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 4px; background: #DDD6CB"></span>Blocked</span>
</div>
</div>
<div style="margin-top: 14px; overflow-x: auto">
<div style="min-width: 900px; display: flex; flex-direction: column; gap: 6px">
<div style="display: grid; grid-template-columns: 110px repeat(10, minmax(0, 1fr)); gap: 4px; font-size: 12px; color: #625B52; text-align: center">
<span></span>
<sc-for list="{{days}}" as="d" hint-placeholder-count="10"><span style="padding: 6px 0; border-radius: 8px; background: {{d.bg}}; color: {{d.fg}}; font-weight: {{d.fw}}">{{d.label}}</span></sc-for>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="12">
<div style="display: grid; grid-template-columns: 110px repeat(10, minmax(0, 1fr)); gap: 4px; align-items: center; height: 34px">
<span style="grid-column: 1; font-size: 13px"><span style="font-weight: 600">{{r.unit}}</span> <span style="color: #625B52">{{r.type}}</span></span>
<sc-for list="{{r.bookings}}" as="b" hint-placeholder-count="1">
<span style="grid-column: {{b.col}}; grid-row: 1; height: 30px; box-sizing: border-box; padding: 0 10px; border-radius: 8px; background: {{b.bg}}; color: {{b.fg}}; border: {{b.border}}; font-size: 12.5px; font-weight: 500; display: flex; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{b.name}}</span>
</sc-for>
</div>
</sc-for>
</div>
</div>
</section>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px">
<section aria-label="Arrivals today" style="border-radius: 20px; background: #FFFFFF; border: 1px solid #E6E0D6; padding: 18px">
<h2 style="margin: 0 0 8px; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: 26px">Arriving today</h2>
<div style="display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid #EEE9E1; font-size: 14px"><div><div style="font-weight: 500">Amina Bello · 2B</div><div style="color: #625B52">Around 3 pm · wants airport pickup</div></div><span style="align-self: center; color: #2F5D46; font-weight: 500">Paid · ID ok</span></div>
<div style="display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid #EEE9E1; font-size: 14px"><div><div style="font-weight: 500">Tunde Ajayi · 1C</div><div style="color: #625B52">Around 5 pm</div></div><span style="align-self: center; color: #8C3C2C; font-weight: 500">ID missing</span></div>
<div style="display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; font-size: 14px"><div><div style="font-weight: 500">Grace Okoro · 3A</div><div style="color: #625B52">After 8 pm · via Instagram</div></div><span style="align-self: center; color: #2F5D46; font-weight: 500">Paid · ID ok</span></div>
</section>
<section aria-label="Payments to check" style="border-radius: 20px; background: #FFFFFF; border: 1px solid #E6E0D6; padding: 18px">
<h2 style="margin: 0 0 8px; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: 26px">Payments to check</h2>
<div style="padding: 10px 0; border-bottom: 1px solid #EEE9E1; font-size: 14px"><div style="font-weight: 500">Ibrahim Musa · 1E · 3 nights</div><div style="color: #625B52">Sent ₦290,000 of ₦410,000</div><div style="margin-top: 8px; display: flex; gap: 8px"><button style="height: 36px; padding: 0 14px; border-radius: 18px; border: 0; background: #1C1B19; color: #F3EFE8; font-family: inherit; font-size: 13px">Ask for the balance</button><button style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #CFC7BA; background: #FBF9F5; font-family: inherit; font-size: 13px; color: #1C1B19">Call guest</button></div></div>
<div style="padding: 10px 0; font-size: 14px"><div style="font-weight: 500">Hold on 3A · 1 – 2 Nov</div><div style="color: #625B52">Not paid yet · releases in 22 min</div></div>
</section>
<section aria-label="Guest requests" style="border-radius: 20px; background: #FFFFFF; border: 1px solid #E6E0D6; padding: 18px">
<h2 style="margin: 0 0 8px; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: 26px">Guest requests</h2>
<div style="display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid #EEE9E1; font-size: 14px"><div><div style="font-weight: 500">2B · Two extra towels</div><div style="color: #625B52">6:12 pm · Housekeeping</div></div><span style="align-self: center; font-weight: 500">On the way</span></div>
<div style="display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; font-size: 14px"><div><div style="font-weight: 500">1D · Air conditioner noisy</div><div style="color: #625B52">4:40 pm · Maintenance</div></div><span style="align-self: center; color: #8C3C2C; font-weight: 500">Not started</span></div>
</section>
</div>
</main>
</div>
</template>
<script src="runtime.js"></script>
<script>
class Component extends DCLogic {
renderVals() {
const names = ['Sat 24', 'Sun 25', 'Mon 26', 'Tue 27', 'Wed 28', 'Thu 29', 'Fri 30', 'Sat 31', 'Sun 1', 'Mon 2'];
const days = names.map((label, i) => ({
label, bg: i === 0 ? '#1C1B19' : 'transparent', fg: i === 0 ? '#F3EFE8' : '#625B52', fw: i === 0 ? '600' : '400'
}));
const tones = {
app: { bg: '#1C1B19', fg: '#F3EFE8', border: '0' },
staff: { bg: '#6E5843', fg: '#F3EFE8', border: '0' },
unpaid: { bg: '#F3EFE8', fg: '#1C1B19', border: '1.5px dashed #1C1B19' },
block: { bg: '#DDD6CB', fg: '#3D3832', border: '0' }
};
const b = (s, l, name, tone) => ({ col: (s + 2) + ' / span ' + l, name, ...tones[tone || 'app'] });
const rows = [
{ unit: '1A', type: '1 bed', bookings: [b(1, 3, 'K. Adeyemi'), b(6, 4, 'Zainab · Instagram', 'staff')] },
{ unit: '1B', type: '1 bed', bookings: [b(0, 5, 'F. Danjuma')] },
{ unit: '1C', type: '1 bed', bookings: [b(0, 2, 'Tunde Ajayi'), b(4, 2, 'Repairs', 'block')] },
{ unit: '1D', type: '1 bed', bookings: [b(0, 10, 'Mr Lawal · monthly stay', 'staff')] },
{ unit: '1E', type: '1 bed', bookings: [b(0, 3, 'Ibrahim Musa · part paid', 'unpaid')] },
{ unit: '1F', type: '1 bed', bookings: [b(5, 3, 'S. Eze')] },
{ unit: '2A', type: '2 bed', bookings: [b(0, 2, 'Chika N.'), b(3, 4, 'E. Bassey')] },
{ unit: '2B', type: '2 bed', bookings: [b(0, 3, 'Amina Bello')] },
{ unit: '2C', type: '2 bed', bookings: [b(2, 5, 'M. Sani · walk-in', 'staff')] },
{ unit: '2D', type: '2 bed', bookings: [b(0, 4, 'O. Williams')] },
{ unit: '3A', type: '3 bed', bookings: [b(0, 2, 'Grace Okoro · Instagram', 'staff'), b(8, 2, 'Held 30 min', 'unpaid')] },
{ unit: '3B', type: '3 bed', bookings: [b(0, 9, '[COMPANY] · corporate', 'staff')] }
];
return { days, rows };
}
}

mount(Component);
</script>
</body>
</html>
