<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Review your stay · The Palm</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Jost:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C1B19}a:hover{color:#5E4C3C}
input:focus,textarea:focus,select:focus{outline:2px solid #1C1B19;outline-offset:1px}
</style>
</head>
<body>
<div id="dc"></div>
<template id="tpl">

<div style="width: 390px; height: 1160px; position: relative; overflow: hidden; background: #F3EFE8; font-family: 'Jost', system-ui, sans-serif; color: #1C1B19">
<div style="padding: 56px 20px 0; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: center; gap: 14px">
<a href="Dates.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #DDD6CB; background: #FBF9F5; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1C1B19" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<h1 style="margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: 32px">Review your stay</h1>
</div>
<div style="display: flex; gap: 14px; padding: 12px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E6E0D6">
<img src="../assets/living.jpg" alt="Two-bedroom apartment" style="width: 92px; height: 92px; border-radius: 12px; object-fit: cover">
<div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 3px">
<div style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 22px; font-weight: 600; line-height: 1.1">Two-Bedroom Apartment</div>
<div style="font-size: 14px; color: #625B52">Sat 24 Oct – Tue 27 Oct</div>
<div style="font-size: 14px; color: #625B52">3 nights · 2 adults</div>
</div>
<a href="Dates.html" style="align-self: flex-start; font-size: 14px; text-underline-offset: 3px">Edit</a>
</div>
<div style="border-radius: 18px; background: #FFFFFF; border: 1px solid #E6E0D6; padding: 6px 16px">
<div style="display: flex; justify-content: space-between; padding: 10px 0; font-size: 15px"><span style="color: #625B52">₦200,000 × 3 nights</span><span>₦600,000</span></div>
<div style="display: flex; justify-content: space-between; padding: 10px 0; font-size: 15px; border-bottom: 1px solid #EEE9E1"><span style="color: #625B52">Caution deposit<br><span style="font-size: 13px">Refunded after check-out</span></span><span>₦50,000</span></div>
<div style="display: flex; justify-content: space-between; padding: 12px 0; font-size: 17px; font-weight: 600"><span>Total to pay</span><span>₦650,000</span></div>
</div>
<h2 style="margin: 4px 0 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: 26px">Who's staying</h2>
<div style="display: flex; flex-direction: column; gap: 12px">
<div><label for="name" style="font-size: 13px; color: #625B52">Full name, as on your ID</label><input id="name" value="Amina Bello" style="margin-top: 6px; width: 100%; box-sizing: border-box; height: 50px; padding: 0 14px; border-radius: 12px; border: 1px solid #DDD6CB; background: #FBF9F5; font-family: inherit; font-size: 16px; color: #1C1B19"></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div><label for="tel" style="font-size: 13px; color: #625B52">Phone</label><input id="tel" value="0803 412 7756" style="margin-top: 6px; width: 100%; box-sizing: border-box; height: 50px; padding: 0 14px; border-radius: 12px; border: 1px solid #DDD6CB; background: #FBF9F5; font-family: inherit; font-size: 16px; color: #1C1B19"></div>
<div><label for="eta" style="font-size: 13px; color: #625B52">Arriving around</label><select id="eta" style="margin-top: 6px; width: 100%; height: 50px; padding: 0 12px; border-radius: 12px; border: 1px solid #DDD6CB; background: #FBF9F5; font-family: inherit; font-size: 16px; color: #1C1B19"><option>3:00 pm</option><option>5:00 pm</option><option>After 8:00 pm</option></select></div>
</div>
<div><label for="email" style="font-size: 13px; color: #625B52">Email, for your receipt</label><input id="email" type="email" value="amina.bello@gmail.com" style="margin-top: 6px; width: 100%; box-sizing: border-box; height: 50px; padding: 0 14px; border-radius: 12px; border: 1px solid #DDD6CB; background: #FBF9F5; font-family: inherit; font-size: 16px; color: #1C1B19"></div>
</div>
<div style="padding: 14px; border-radius: 16px; background: #FFFFFF; border: 1px dashed #B9AE9F; display: flex; align-items: center; gap: 12px">
<span style="width: 44px; height: 44px; border-radius: 12px; background: #EDE6DA; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C1B19" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="11" r="2.2"></circle><path d="M5.8 16c.5-1.6 1.7-2.4 3.2-2.4s2.7.8 3.2 2.4M14.5 10h4M14.5 13h3"></path></svg></span>
<div style="flex: 1"><div style="font-size: 15px; font-weight: 500">ID uploaded</div><div style="font-size: 13px; color: #625B52">NIN slip · checked by the front desk</div></div>
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#2F5D46"></circle><path d="M7.5 12.3l3 3 6-6" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</div>
<div><label for="req" style="font-size: 13px; color: #625B52">Anything we should prepare? (optional)</label><textarea id="req" rows="2" style="margin-top: 6px; width: 100%; box-sizing: border-box; padding: 12px 14px; border-radius: 12px; border: 1px solid #DDD6CB; background: #FBF9F5; font-family: inherit; font-size: 15px; color: #1C1B19; resize: none">Airport pickup on arrival, please.</textarea></div>
<label style="display: flex; gap: 12px; align-items: flex-start; font-size: 14px; line-height: 1.45; color: #3D3832"><input type="checkbox" checked style="width: 20px; height: 20px; margin: 1px 0 0; accent-color: #1C1B19">I agree to the house rules and the cancellation policy.</label>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 14px 20px 30px; background: #FBF9F5; border-top: 1px solid #E6E0D6; display: flex; align-items: center; gap: 14px">
<div style="flex: 1"><div style="font-size: 17px; font-weight: 600">₦650,000</div><div style="font-size: 13px; color: #625B52">Includes ₦50,000 deposit</div></div>
<a href="Pay.html" style="display: flex; align-items: center; justify-content: center; height: 54px; padding: 0 26px; border-radius: 27px; background: #1C1B19; color: #F3EFE8; font-size: 16px; font-weight: 500; text-decoration: none">Go to payment</a>
</div>
</div>
</template>
<script src="runtime.js"></script>
<script>
class Component extends DCLogic {
renderVals() {
return {};
}
}

mount(Component);
</script>
</body>
</html>
