<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Payment · The Palm</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Jost:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C1B19}a:hover{color:#5E4C3C}
input:focus{outline:2px solid #1C1B19;outline-offset:1px}
</style>
</head>
<body>
<div id="dc"></div>
<template id="tpl">

<div style="width: 390px; height: 960px; position: relative; overflow: hidden; background: #F3EFE8; font-family: 'Jost', system-ui, sans-serif; color: #1C1B19">
<div style="padding: 56px 20px 0; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: center; gap: 14px">
<a href="Review.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #DDD6CB; background: #FBF9F5; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1C1B19" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<h1 style="margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: 32px">Payment</h1>
</div>
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: #EDE6DA">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C1B19" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2M9.5 2.5h5"></path></svg>
<div style="font-size: 14px; line-height: 1.4">We're holding this apartment for you for <span style="font-weight: 600">29:41</span>. Pay before then to keep it.</div>
</div>
<div style="text-align: center; padding: 6px 0">
<div style="font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #625B52">Amount to pay</div>
<div style="margin-top: 4px; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 48px; font-weight: 500; line-height: 1">₦650,000</div>
</div>
<div role="tablist" aria-label="Payment method" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; padding: 5px; border-radius: 26px; background: #E6E0D6">
<sc-for list="{{methods}}" as="m" hint-placeholder-count="2">
<sc-if value="{{m.on}}" hint-placeholder-val="{{false}}"><button role="tab" aria-selected="true" onClick="{{m.pick}}" style="height: 42px; border: 0; border-radius: 21px; background: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600; color: #1C1B19; box-shadow: 0 1px 3px rgba(28,27,25,0.12)">{{m.label}}</button></sc-if>
<sc-if value="{{m.off}}" hint-placeholder-val="{{true}}"><button role="tab" aria-selected="false" onClick="{{m.pick}}" style="height: 42px; border: 0; border-radius: 21px; background: transparent; font-family: inherit; font-size: 15px; color: #3D3832">{{m.label}}</button></sc-if>
</sc-for>
</div>
<sc-if value="{{transfer}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 14px">
<div style="border-radius: 18px; background: #1C1B19; color: #F3EFE8; padding: 18px">
<div style="font-size: 13px; color: #CFC7BA">Transfer exactly ₦650,000 to</div>
<div style="margin-top: 14px; display: flex; justify-content: space-between; align-items: center">
<div><div style="font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #CFC7BA">Account number</div><div style="margin-top: 2px; font-size: 26px; font-weight: 500; letter-spacing: 0.06em">[ACCOUNT NO.]</div></div>
<button style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid rgba(243,239,232,0.5); background: transparent; color: #F3EFE8; font-family: inherit; font-size: 14px">Copy</button>
</div>
<div style="margin-top: 14px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; font-size: 15px">
<div><div style="font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #CFC7BA">Bank</div>[BANK NAME]</div>
<div><div style="font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #CFC7BA">Account name</div>The Palm / Citystake</div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px; font-size: 14px; line-height: 1.45; color: #3D3832">
<div style="display: flex; gap: 10px"><span style="flex: 0 0 22px; height: 22px; border-radius: 11px; background: #E6E0D6; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center">1</span>This account number is for this booking only. Use it once.</div>
<div style="display: flex; gap: 10px"><span style="flex: 0 0 22px; height: 22px; border-radius: 11px; background: #E6E0D6; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center">2</span>Your booking confirms by itself as soon as the money lands, usually within a minute.</div>
</div>
</div>
</sc-if>
<sc-if value="{{card}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 12px">
<div><label for="cn" style="font-size: 13px; color: #625B52">Card number</label><input id="cn" value="5399 8312 •••• 4410" style="margin-top: 6px; width: 100%; box-sizing: border-box; height: 52px; padding: 0 14px; border-radius: 12px; border: 1px solid #DDD6CB; background: #FBF9F5; font-family: inherit; font-size: 16px; color: #1C1B19; letter-spacing: 0.04em"></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div><label for="ex" style="font-size: 13px; color: #625B52">Expiry</label><input id="ex" value="08 / 28" style="margin-top: 6px; width: 100%; box-sizing: border-box; height: 52px; padding: 0 14px; border-radius: 12px; border: 1px solid #DDD6CB; background: #FBF9F5; font-family: inherit; font-size: 16px; color: #1C1B19"></div>
<div><label for="cv" style="font-size: 13px; color: #625B52">CVV</label><input id="cv" value="•••" style="margin-top: 6px; width: 100%; box-sizing: border-box; height: 52px; padding: 0 14px; border-radius: 12px; border: 1px solid #DDD6CB; background: #FBF9F5; font-family: inherit; font-size: 16px; color: #1C1B19"></div>
</div>
<label style="display: flex; gap: 10px; align-items: center; font-size: 14px; color: #3D3832"><input type="checkbox" checked style="width: 20px; height: 20px; margin: 0; accent-color: #1C1B19">Save this card for next time</label>
<div style="display: flex; gap: 8px; align-items: center; font-size: 13px; color: #625B52"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#625B52" stroke-width="1.6" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2"></rect><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"></path></svg>Your bank may ask for a one-time PIN.</div>
</div>
</sc-if>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 14px 20px 30px; background: #FBF9F5; border-top: 1px solid #E6E0D6">
<a href="Confirmed.html" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 27px; background: #1C1B19; color: #F3EFE8; font-size: 16px; font-weight: 500; text-decoration: none">{{cta}}</a>
</div>
</div>
</template>
<script src="runtime.js"></script>
<script>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { method: 'transfer' };
}
renderVals() {
const method = this.state.method;
const methods = [['transfer', 'Bank transfer'], ['card', 'Debit card']].map(([id, label]) => ({
label, on: method === id, off: method !== id, pick: () => this.setState({ method: id })
}));
return {
methods,
transfer: method === 'transfer',
card: method === 'card',
cta: method === 'transfer' ? "I've sent the money" : 'Pay ₦650,000'
};
}
}

mount(Component);
</script>
</body>
</html>
